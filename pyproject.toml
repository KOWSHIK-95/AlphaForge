[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alphaforge"
version = "0.1.0"
description = "A quantitative finance and portfolio analytics project"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pandas",
    "numpy",
    "psycopg[binary]>=3.2",
    "scipy",
    "sqlalchemy>=2.0",
    "yfinance>=0.2.54",
]

[project.optional-dependencies]
test = ["pytest", "httpx"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]